{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h1 class="h4 fw-semibold mb-3"><i class="bi bi-person-plus me-2"></i>Crear cuenta</h1>
      <form method="POST">
        <div class="mb-3"><label class="form-label">Nombre completo</label>
          <input name="nombre" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Correo</label>
          <input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Carrera (opcional)</label>
          <input name="carrera" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-bosque w-100">Registrarme</button>
      </form>
      <p class="text-muted small mt-3 mb-0">¿Ya tienes cuenta?
        <a href="{{ url_for('login') }}">Inicia sesión</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
